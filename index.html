  var styleTag = document.createElement('style');
  styleTag.id = 'app-style';
  styleTag.textContent = CSS_TEXT;
  document.head.appendChild(styleTag);

  function readPublishedState(){
    var el = document.getElementById('state-data');
    if (!el) return null;
    try { return JSON.parse(el.textContent); } catch(e){ return null; }
  }

  var FIREBASE_URL = 'https://msc-seascape-signup-default-rtdb.firebaseio.com';
  var PINAUTH_KEY = 'msc-signup-pinauth-v1';
  var state = readPublishedState();
  var readOnly = false;
  var readOnlyReason = '';
  var currentStatus = { kind: 'connecting', text: 'Connecting…' };
  var myFamilyId = null;
  try { myFamilyId = localStorage.getItem(MYFAM_KEY); } catch(e){}
  var activeMemberId = {};
  var addActivityForm = { dayId: null, type: 'excursion' };
  var apiPromise = null;
  var mobileNavOpen = false;

  // ---------- PIN auth (family-scoped write gate) ----------
  var authedFamilies = {}; // { familyId: sha256hex } - families THIS browser has unlocked
  try { authedFamilies = JSON.parse(localStorage.getItem(PINAUTH_KEY) || '{}'); } catch(e){ authedFamilies = {}; }
  function saveAuthedFamilies(){ try { localStorage.setItem(PINAUTH_KEY, JSON.stringify(authedFamilies)); } catch(e){} }

  var pinSetCache = {};
  var pinGate = { familyId: null, mode: null, error: '', busy: false };

  function hasCrypto(){ return !!(window.crypto && window.crypto.subtle && window.isSecureContext !== false); }

  function sha256Hex(str){
    var enc = new TextEncoder().encode(str);
    return crypto.subtle.digest('SHA-256', enc).then(function(buf){
      var bytes = new Uint8Array(buf);
      var hex = '';
      for (var i=0;i<bytes.length;i++){ var h = bytes[i].toString(16); hex += (h.length===1?'0':'')+h; }
      return hex;
    });
  }

  function firebasePatch(updates){
    return fetch(FIREBASE_URL + '/.json', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(updates)
    }).then(function(res){
      if (!res.ok) { var e = new Error('HTTP ' + res.status); e.status = res.status; throw e; }
      return res;
    });
  }

  function fetchPinSet(familyId){
    return fetch(FIREBASE_URL + '/pinSet/' + encodeURIComponent(familyId) + '.json', { cache: 'no-store' })
      .then(function(res){ return res.ok ? res.json() : null; })
      .then(function(val){ pinSetCache[familyId] = !!val; return !!val; })
      .catch(function(){ return !!pinSetCache[familyId]; });
  }

  function toggleMobileNav(){
    mobileNavOpen = !mobileNavOpen;
    try { document.body.style.overflow = mobileNavOpen ? 'hidden' : ''; } catch(e){}
    render();
  }

  function closeMobileNav(){
    if (!mobileNavOpen) return;
    mobileNavOpen = false;
    try { document.body.style.overflow = ''; } catch(e){}
    render();
  }

  function clone(x){ return JSON.parse(JSON.stringify(x)); }

  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  function escapeAttr(s){ return escapeHtml(s); }

  function safeUrl(u){
    u = (u || '').trim();
    if (!u) return '';
    if (/^https?:\/\//i.test(u)) return u;
    return '';
  }

  function slugify(s){
    var out = String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-+|-+$)/g,'').slice(0,40);
    return out || 'item';
  }

  function hasOwn(obj, key){ return !!obj && Object.prototype.hasOwnProperty.call(obj, key); }

  function findFamily(s, id){
    var list = s.families || [];
    for (var i=0;i<list.length;i++) if (list[i].id === id) return list[i];
    return null;
  }

  function findActivity(s, id){
    var list = s.activities || [];
    for (var i=0;i<list.length;i++) if (list[i].id === id) return list[i];
    return null;
  }

  function findDay(s, id){
    var list = s.days || [];
    for (var i=0;i<list.length;i++) if (list[i].id === id) return list[i];
    return null;
  }

  function sortedDays(s){
    return (s.days || []).slice().sort(function(a,b){ return (a.order||0) - (b.order||0); });
  }

  function activitiesForDay(s, dayId){
    return (s.activities || []).filter(function(a){ return a.dayId === dayId; });
  }

  function parsePricePerPerson(priceStr){
    if (!priceStr) return null;
    var m = String(priceStr).match(/\$\s?([\d,]+(?:\.\d+)?)/);
    if (!m) return null;
    var n = parseFloat(m[1].replace(/,/g,''));
    return isNaN(n) ? null : n;
  }

  function formatMoney(n){ return '$' + n.toFixed(2); }

  function formatWhen(iso){
    if (!iso) return 'not yet saved';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return 'unknown';
    try {
      return d.toLocaleString(undefined, { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' });
    } catch(e){ return d.toString(); }
  }

  // ---------- drafts (local, per-family working copy) ----------
  var drafts = {};
  try { drafts = JSON.parse(localStorage.getItem(DRAFT_KEY) || '{}'); } catch(e){ drafts = {}; }

  function saveDraftsToLocal(){
    try { localStorage.setItem(DRAFT_KEY, JSON.stringify(drafts)); } catch(e){}
  }

  function buildFreshDraft(familyId){
    var f = findFamily(state, familyId);
    if (!f) return { id: familyId, name: 'Family', members: [], signups: {} };
    var d = { id: f.id, name: f.name, members: clone(f.members), signups: {} };
    f.members.forEach(function(m){ d.signups[m.id] = clone(state.signups[m.id] || {}); });
    return d;
  }

  function getDraftFamily(familyId){
    if (!drafts[familyId]) {
      drafts[familyId] = buildFreshDraft(familyId);
      saveDraftsToLocal();
    }
    return drafts[familyId];
  }

  function normalizeDraft(d){
    return {
      name: d.name,
      members: d.members.map(function(m){ return { id: m.id, name: m.name }; }),
      signups: d.members.reduce(function(acc, m){
        var obj = d.signups[m.id] || {};
        var keys = Object.keys(obj).sort();
        acc[m.id] = keys.map(function(k){ return k + '::' + (obj[k] || ''); }).join('|');
        return acc;
      }, {})
    };
  }

  function isDirty(familyId){
    var d = drafts[familyId];
    if (!d) return false;
    return JSON.stringify(normalizeDraft(d)) !== JSON.stringify(normalizeDraft(buildFreshDraft(familyId)));
  }

  function discardFamily(familyId){
    delete drafts[familyId];
    saveDraftsToLocal();
    render();
  }

  // ---------- shared-state reads ----------
  function countForActivity(activityId){
    var n = 0;
    Object.keys(state.signups || {}).forEach(function(mid){
      if (hasOwn(state.signups[mid], activityId)) n++;
    });
    return n;
  }

  function getParticipants(activityId){
    var out = [];
    (state.families || []).forEach(function(f){
      f.members.forEach(function(m){
        var picks = state.signups[m.id];
        if (hasOwn(picks, activityId)) {
          out.push({ familyName: f.name, memberName: m.name, note: picks[activityId] || '' });
        }
      });
    });
    return out;
  }

  function setStatus(kind, text){
    currentStatus = { kind: kind, text: text };
  }

  function documentTemplate(s){
    var json = JSON.stringify(s).replace(/</g, '\\u003c');
    var engineEl = document.getElementById('engine');
    var engineSrc = engineEl ? engineEl.textContent : '';
    return '<!doctype html>\n<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seascape Activity Sign-Up</title></head><body>' +
      '<script type="application/json" id="state-data">' + json + '<' + '/script>' +
      '<div id="root"></div><div id="toast-region" aria-live="polite"></div>' +
      '<script id="engine">' + engineSrc + '<' + '/script>' +
      '</body></html>';
  }

  function toast(msg){
    var region = document.getElementById('toast-region');
    if (!region) return;
    var el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    region.appendChild(el);
    setTimeout(function(){
      el.classList.add('out');
      setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 320);
    }, 3800);
  }

  function doPublish(newState, stash){
    state = newState;
    render();
    setStatus('saving', 'Saving…');
    render();
    fetch(FIREBASE_URL + '/state.json', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(newState)
    }).then(function(res){
      if (!res.ok) throw new Error('HTTP ' + res.status);
      setStatus('saved', 'Saved.');
      render();
      var msg = 'Saved.';
      if (stash && stash.kind === 'save-family') msg = 'Saved — your family’s picks are in.';
      else if (stash && stash.kind === 'add-activity') msg = 'Activity added for everyone.';
      else if (stash && stash.kind === 'add-family') msg = 'Family added.';
      toast(msg);
    }).catch(function(err){
      readOnly = false;
      setStatus('error', 'Could not save just now — your changes are kept here, try again.');
      render();
      toast('Could not save just now — try again.');
    });
  }

  function sameSignupMap(a, b){
    a = a || {}; b = b || {};
    var ak = Object.keys(a).sort(), bk = Object.keys(b).sort();
    if (ak.length !== bk.length) return false;
    for (var i=0;i<ak.length;i++){
      if (ak[i] !== bk[i]) return false;
      if ((a[ak[i]] || '') !== (b[bk[i]] || '')) return false;
    }
    return true;
  }

  function reconcileOnBoot(){
    return; // no-op: Firebase PUT is fire-and-confirm, no stash/replay needed
    var raw = null;
    try { raw = sessionStorage.getItem(STASH_KEY); } catch(e){}
    if (!raw) return;
    var stash;
    try { stash = JSON.parse(raw); } catch(e){ try { sessionStorage.removeItem(STASH_KEY); } catch(e2){} return; }
    if (!stash || !stash.ts || (Date.now() - stash.ts) > 10*60*1000) { try { sessionStorage.removeItem(STASH_KEY); } catch(e){} return; }

    if (stash.kind === 'save-family') {
      var fam = findFamily(state, stash.familyId);
      var applied = fam && JSON.stringify(fam) === JSON.stringify(stash.family);
      var signupsOk = applied && Object.keys(stash.signups).every(function(mid){
        return sameSignupMap(state.signups[mid], stash.signups[mid]);
      });
      if (applied && signupsOk) { try { sessionStorage.removeItem(STASH_KEY); } catch(e){} toast('Your picks were saved.'); return; }
      if (!stash.retried) {
        stash.retried = true;
        var healed = clone(state);
        var idx = -1;
        (healed.families||[]).forEach(function(f,i){ if (f.id === stash.familyId) idx = i; });
        if (idx === -1) healed.families.push(stash.family); else healed.families[idx] = stash.family;
        Object.keys(stash.signups).forEach(function(mid){
          var picks = stash.signups[mid];
          if (picks && Object.keys(picks).length) healed.signups[mid] = picks;
          else delete healed.signups[mid];
        });
        healed.meta.updatedAt = new Date().toISOString();
        doPublish(healed, stash);
        return;
      }
      drafts[stash.familyId] = { id: stash.family.id, name: stash.family.name, members: clone(stash.family.members), signups: clone(stash.signups) };
      saveDraftsToLocal();
      myFamilyId = stash.familyId;
      try { localStorage.setItem(MYFAM_KEY, myFamilyId); } catch(e){}
      try { sessionStorage.removeItem(STASH_KEY); } catch(e){}
      toast("Your save didn't go through — your picks are restored below. Tap Save to try again.");
    } else if (stash.kind === 'add-activity') {
      var exists = (state.activities||[]).some(function(a){ return a.id === stash.activity.id; });
      if (exists) { try { sessionStorage.removeItem(STASH_KEY); } catch(e){} return; }
      if (!stash.retried) {
        stash.retried = true;
        var healed2 = clone(state);
        healed2.activities.push(stash.activity);
        healed2.meta.updatedAt = new Date().toISOString();
        doPublish(healed2, stash);
        return;
      }
      try { sessionStorage.removeItem(STASH_KEY); } catch(e){}
      toast('Could not add "' + stash.activity.name + '" — try adding it again.');
    } else if (stash.kind === 'add-family') {
      var exists2 = (state.families||[]).some(function(f){ return f.id === stash.family.id; });
      if (exists2) { try { sessionStorage.removeItem(STASH_KEY); } catch(e){} return; }
      if (!stash.retried) {
        stash.retried = true;
        var healed3 = clone(state);
        healed3.families.push(stash.family);
        healed3.meta.updatedAt = new Date().toISOString();
        doPublish(healed3, stash);
        return;
      }
      try { sessionStorage.removeItem(STASH_KEY); } catch(e){}
      toast('Could not add the new family — try again.');
    }
  }

  // ---------- user actions ----------
  // Sets pinGate to reflect whether familyId is currently authenticated in this browser.
  // Does NOT render by itself for the synchronous/authed case (caller renders); for the
  // async not-yet-known case it sets pinGate to 'checking' synchronously (safe for the
  // caller's own render) and triggers its own render() once the check resolves.
  function applyFamilyGate(familyId){
    if (!familyId) { pinGate = { familyId: null, mode: null, error: '', busy: false }; return; }
    if (authedFamilies[familyId]) {
      pinGate = { familyId: null, mode: null, error: '', busy: false };
      var d = getDraftFamily(familyId);
      if (!activeMemberId[familyId]) activeMemberId[familyId] = d.members[0] && d.members[0].id;
      return;
    }
    pinGate = { familyId: familyId, mode: 'checking', error: '', busy: true };
    fetchPinSet(familyId).then(function(isSet){
      if (myFamilyId !== familyId) return; // user switched away while we were checking
      pinGate = { familyId: familyId, mode: isSet ? 'enter' : 'setup', error: '', busy: false };
      render();
    });
  }

  function selectFamily(familyId){
    myFamilyId = familyId;
    try { localStorage.setItem(MYFAM_KEY, familyId); } catch(e){}
    applyFamilyGate(familyId);
    render();
  }

  function submitPinSetup(familyId){
    var v1El = document.querySelector('[data-field="pin-setup"][data-family-id="'+familyId+'"]');
    var v2El = document.querySelector('[data-field="pin-setup-confirm"][data-family-id="'+familyId+'"]');
    var v1 = (v1El && v1El.value || '').trim();
    var v2 = (v2El && v2El.value || '').trim();
    if (!/^\d{4}$/.test(v1)) { pinGate.error = 'Enter exactly 4 digits.'; render(); return; }
    if (v1 !== v2) { pinGate.error = "PINs don't match — try again."; render(); return; }
    if (!hasCrypto()) { pinGate.error = "This browser can't set a PIN securely. Open this link in Chrome or Safari instead of an in-app browser."; render(); return; }
    pinGate.busy = true; pinGate.error = ''; render();
    sha256Hex(familyId + ':' + v1).then(function(hash){
      var updates = {};
      updates['pins/' + familyId] = hash;
      updates['pinSet/' + familyId] = true;
      updates['_proof/' + familyId] = hash;
      return firebasePatch(updates).then(function(){
        authedFamilies[familyId] = hash;
        saveAuthedFamilies();
        pinSetCache[familyId] = true;
        pinGate = { familyId: null, mode: null, error: '', busy: false };
        toast("PIN set. Share it with your family directly — there's no reset if it's lost, so keep it somewhere safe.");
        render();
        var clearU = {}; clearU['_proof/' + familyId] = null;
        firebasePatch(clearU).catch(function(){});
      });
    }).catch(function(err){
      pinGate.busy = false;
      if (err && (err.status === 401 || err.status === 403)) {
        pinGate.error = 'Someone just set a PIN for this family. Refresh and enter the PIN they set instead.';
        pinGate.mode = 'enter';
        pinSetCache[familyId] = true;
      } else {
        pinGate.error = 'Could not set the PIN — check your connection and try again.';
      }
      render();
    });
  }

  function submitPinEnter(familyId){
    var vEl = document.querySelector('[data-field="pin-enter"][data-family-id="'+familyId+'"]');
    var v = (vEl && vEl.value || '').trim();
    if (!/^\d{4}$/.test(v)) { pinGate.error = 'Enter the 4-digit PIN.'; render(); return; }
    if (!hasCrypto()) { pinGate.error = "This browser can't verify a PIN securely. Open this link in Chrome or Safari instead of an in-app browser."; render(); return; }
    pinGate.busy = true; pinGate.error = ''; render();
    sha256Hex(familyId + ':' + v).then(function(hash){
      var updates = {};
      updates['_proof/' + familyId] = hash;
      updates['familyHeartbeat/' + familyId] = Date.now();
      return firebasePatch(updates).then(function(){
        authedFamilies[familyId] = hash;
        saveAuthedFamilies();
        pinGate = { familyId: null, mode: null, error: '', busy: false };
        toast('Welcome back — you can edit your picks now.');
        render();
        var clearU = {}; clearU['_proof/' + familyId] = null;
        firebasePatch(clearU).catch(function(){});
      });
    }).catch(function(err){
      pinGate.busy = false;
      pinGate.error = "Wrong PIN. There's no self-service reset — contact Thameem directly if you're stuck.";
      render();
    });
  }

    render();
    setStatus('saving', 'Saving…'); render();

    firebasePatch(updates).then(function(){

  function addMember(familyId){
    if (readOnly) return;
    var draft = getDraftFamily(familyId);
    var id = familyId + '-m' + Date.now().toString(36) + Math.random().toString(36).slice(2,5);
    draft.members.push({ id:id, name:'New person' });
    draft.signups[id] = {};

    saveDraftsToLocal();
    render();
    requestAnimationFrame(function(){
      var el = document.querySelector('[data-field="member-name"][data-member-id="'+id+'"]');
      if (el) { el.focus(); el.select(); }

  function removeMember(familyId, memberId){
    if (readOnly) return;
    var draft = getDraftFamily(familyId);
    if (draft.members.length <= 1) return;
    draft.members = draft.members.filter(function(m){ return m.id !== memberId; });
    delete draft.signups[memberId];
    if (activeMemberId[familyId] === memberId) activeMemberId[familyId] = draft.members[0] && draft.members[0].id;
    saveDraftsToLocal();
    render();
  }

  function toggleActivity(familyId, memberId, activityId){
    if (readOnly) return;
    var draft = getDraftFamily(familyId);
    var obj = draft.signups[memberId] || (draft.signups[memberId] = {});
    if (hasOwn(obj, activityId)) delete obj[activityId];
    else obj[activityId] = '';
    saveDraftsToLocal();
    render();
  }

  function setPickNote(familyId, memberId, activityId, noteText){
    if (readOnly) return;
    var draft = getDraftFamily(familyId);
    var obj = draft.signups[memberId] || (draft.signups[memberId] = {});
    if (hasOwn(obj, activityId)) {
      obj[activityId] = noteText;
      saveDraftsToLocal();
    }
  }

  function saveFamily(familyId){
    if (readOnly) return;
    var draft = drafts[familyId];
    if (!draft) return;
    var proofHash = authedFamilies[familyId];
    if (!proofHash) { toast("Enter your family's PIN first."); selectFamily(familyId); return; }

    var newFamilies = clone(state.families || []);
    var draftFamilyOnly = {
      id: draft.id,
      name: (draft.name || '').trim() || 'Family',
      members: draft.members.map(function(m){ return { id:m.id, name:(m.name||'').trim() || 'Member' }; })
    };
    var idx = -1;
    newFamilies.forEach(function(f,i){ if (f.id === familyId) idx = i; });
    if (idx === -1) newFamilies.push(draftFamilyOnly); else newFamilies[idx] = draftFamilyOnly;

    var prevFamily = findFamily(state, familyId);
    var keepIds = draftFamilyOnly.members.map(function(m){ return m.id; });
    var removedIds = [];
    (prevFamily ? prevFamily.members : []).forEach(function(m){
      if (keepIds.indexOf(m.id) === -1) removedIds.push(m.id);
    });

    var newSignups = clone(state.signups || {});
    var stashSignups = {};
    keepIds.forEach(function(mid){
      var picks = clone(draft.signups[mid] || {});
      if (Object.keys(picks).length) newSignups[mid] = picks; else delete newSignups[mid];
      stashSignups[mid] = picks;
    });
    removedIds.forEach(function(mid){ delete newSignups[mid]; });

    var updates = {};
    updates['state/families'] = newFamilies;
    keepIds.forEach(function(mid){
      updates['state/signups/' + mid] = Object.keys(stashSignups[mid]).length ? stashSignups[mid] : null;
      updates['memberFamily/' + mid] = familyId;
    });
    removedIds.forEach(function(mid){ updates['state/signups/' + mid] = null; });
    updates['_proof/' + familyId] = proofHash;
    var updatedAt = new Date().toISOString();
    updates['state/meta/updatedAt'] = updatedAt;

    // optimistic local update
    state.families = newFamilies;
    state.signups = newSignups;
    state.meta = state.meta || {}; state.meta.updatedAt = updatedAt;
    delete drafts[familyId];
    saveDraftsToLocal();
    setStatus('saving', 'Saving…');
    render();

    firebasePatch(updates).then(function(){
      setStatus('saved', 'Saved.');
      render();
      toast('Saved — your family’s picks are in.');
      var clearU = {}; clearU['_proof/' + familyId] = null;
      firebasePatch(clearU).catch(function(){});
    }).catch(function(err){
      drafts[familyId] = draft;
      saveDraftsToLocal();
      setStatus('error', 'Could not save just now — your changes are kept here, try again.');
      render();
      if (err && (err.status === 401 || err.status === 403)) {
        toast('Save blocked — your PIN session may have expired. Try selecting your family again.');
        delete authedFamilies[familyId];
        saveAuthedFamilies();
      } else {
        toast('Could not save just now — try again.');
      }
    });
  }

  function submitAddActivity(){
    if (readOnly) return;
    var nameInput = document.getElementById('add-activity-name');
    var dayInput = document.getElementById('add-activity-day');
    var typeInput = document.getElementById('add-activity-type');
    var priceInput = document.getElementById('add-activity-price');
    var linkInput = document.getElementById('add-activity-link');
    var ytInput = document.getElementById('add-activity-youtube');
    var noteInput = document.getElementById('add-activity-note');

    var name = (nameInput && nameInput.value || '').trim();
    if (!name) { toast('Give the activity a name first.'); if (nameInput) nameInput.focus(); return; }
    var dayId = dayInput && dayInput.value;
    if (!dayId) { toast('Pick which day this belongs to.'); return; }
    var type = (typeInput && typeInput.value) || 'excursion';
    var price = (priceInput && priceInput.value || '').trim();
    var linkRaw = (linkInput && linkInput.value || '').trim();
    var ytRaw = (ytInput && ytInput.value || '').trim();
    var note = (noteInput && noteInput.value || '').trim();

    var link = safeUrl(linkRaw);
    if (linkRaw && !link) { toast('Link must start with https:// — fix it and try again.'); if (linkInput) linkInput.focus(); return; }
    var youtube = safeUrl(ytRaw);
    if (ytRaw && !youtube) { toast('Video link must start with https:// — fix it and try again.'); if (ytInput) ytInput.focus(); return; }

    var newActivities = clone(state.activities || []);
    var activityId = 'act-' + slugify(name) + '-' + Math.random().toString(36).slice(2,5);
    var activity = { id: activityId, dayId: dayId, type: type, name: name, note: note, price: price, link: link, youtube: youtube, status: '' };
    newActivities.push(activity);

    addActivityForm.dayId = dayId;
    addActivityForm.type = type;

    var updatedAt = new Date().toISOString();
    state.activities = newActivities;
    state.meta = state.meta || {}; state.meta.updatedAt = updatedAt;
    render();
    setStatus('saving', 'Saving…'); render();
    var updates = { 'state/activities': newActivities, 'state/meta/updatedAt': updatedAt };
    firebasePatch(updates).then(function(){
      setStatus('saved', 'Saved.'); render();
      toast('Activity added for everyone.');
    }).catch(function(){
      setStatus('error', 'Could not save just now — your changes are kept here, try again.'); render();
      toast('Could not add "' + name + '" — try again.');
    });
    if (nameInput) nameInput.value = '';
    if (priceInput) priceInput.value = '';
    if (linkInput) linkInput.value = '';
    if (ytInput) ytInput.value = '';
    if (noteInput) noteInput.value = '';
  }

  function buildActivityMeta(a){
    var parts = [];
    parts.push('<span class="chip chip-type">' + escapeHtml(TYPES[a.type] || a.type || 'Activity') + '</span>');
    if (a.status === 'confirmed') parts.push('<span class="chip chip-confirmed">Booked</span>');
    else if (a.status === 'pending') parts.push('<span class="chip chip-pending">Under consideration</span>');
    if (a.price) parts.push('<span class="chip chip-price">' + escapeHtml(a.price) + '</span>');
    if (a.link) parts.push('<a class="chip chip-link" href="' + escapeAttr(a.link) + '" target="_blank" rel="noopener">Details &#8599;</a>');
    if (a.youtube) parts.push('<a class="video-preview" href="' + escapeAttr(a.youtube) + '" target="_blank" rel="noopener"><span class="play-badge">&#9654;</span>Watch video</a>');
    return parts.join('');

  function buildOverviewSection(){
    var cards = sortedDays(state).map(buildOverviewDayCard).join('');
    return '<section class="panel overview-panel" id="overview"><div class="panel-head"><span class="eyebrow">What the group is doing</span><h2>Group overview, by day</h2>' +
      '<p class="lede">Saved picks only &mdash; unsaved checkboxes above aren’t counted here until Save is tapped. Tap an activity to see who&#39;s signed up.</p></div>' +
      '<div class="day-grid">' + cards + '</div></section>';
  }

  // ---------- explore / activity details (pure browse, no family needed) ----------
  function buildExploreDayCard(day){
    var acts = activitiesForDay(state, day.id);
    if (!acts.length) return '';
    var rows = acts.map(function(a){
      return '<div class="explore-activity"><div class="explore-activity-name">' + escapeHtml(a.name) + '</div>' +
        '<div class="ov-chips-row">' + buildActivityMeta(a) + '</div>' +
        (a.note ? '<p class="hint" style="margin:6px 0 0">' + escapeHtml(a.note) + '</p>' : '') +
        '</div>';
    }).join('');
    return '<div class="day-card"><div class="day-card-head">' +
      (day.label ? '<span class="day-label">' + escapeHtml(day.label) + '</span>' : '') +
      '<div class="day-title-row"><span class="day-title">' + escapeHtml(day.title) + '</span>' + (day.time ? '<span class="day-time">' + escapeHtml(day.time) + '</span>' : '') + '</div>' +
      (day.note ? '<div class="day-note">' + escapeHtml(day.note) + '</div>' : '') +
      '</div>' + rows + '</div>';
  }

  function buildExploreSection(){
    var cards = sortedDays(state).map(buildExploreDayCard).join('');
    return '<section class="panel explore-panel" id="explore"><div class="panel-head"><span class="eyebrow">Browse & watch</span><h2>Activity Details</h2>' +
      '<p class="lede">Every activity on the trip &mdash; description, price, links, and videos. Just for browsing, no need to pick a family first.</p></div>' +
      '<div class="day-grid">' + cards + '</div></section>';
  }

  // ---------- dashboard ("the full picture") ----------
  function buildDashboardByDay(){
    return sortedDays(state).map(function(day){
      var acts = activitiesForDay(state, day.id);
      if (!acts.length) return '';
      var peopleSet = {};
      var rows = acts.map(function(a){
        var participants = getParticipants(a.id);
        participants.forEach(function(p){ peopleSet[p.familyName + '::' + p.memberName] = true; });
        var count = participants.length;
        var pp = parsePricePerPerson(a.price);
        var subtotal = (pp != null) ? (pp * count) : null;
        return { a: a, count: count, pp: pp, subtotal: subtotal };
      });
      var dayTotalPeople = Object.keys(peopleSet).length;
      var dayPriceTotal = rows.reduce(function(sum, r){ return sum + (r.subtotal || 0); }, 0);
      var anyPriced = rows.some(function(r){ return r.pp != null; });
      var rowsHtml = rows.map(function(r){
        return '<tr><td>' + escapeHtml(r.a.name) + '</td><td class="num">' + r.count + '</td><td class="num">' + (r.pp != null ? formatMoney(r.pp) : '&mdash;') + '</td><td class="num">' + (r.subtotal != null ? formatMoney(r.subtotal) : '&mdash;') + '</td></tr>';
      }).join('');
      var emptyBadge = dayTotalPeople === 0 ? '<span class="chip chip-empty">No one signed up yet</span>' : '';
      return '<div class="dash-day-card">' +
        '<div class="dash-day-head">' + (day.label ? '<span class="day-label">' + escapeHtml(day.label) + '</span>' : '') + '<span class="day-title">' + escapeHtml(day.title) + '</span><span class="dash-day-count">' + dayTotalPeople + ' people</span></div>' +
        emptyBadge +
        (anyPriced ? ('<div class="table-wrap"><table class="dash-table"><thead><tr><th>Activity</th><th class="num">People</th><th class="num">Price</th><th class="num">Subtotal</th></tr></thead><tbody>' + rowsHtml + '</tbody><tfoot><tr><td>Day total</td><td></td><td></td><td class="num">' + formatMoney(dayPriceTotal) + '</td></tr></tfoot></table></div>') : '') +
        '</div>';
    }).join('');
  }

  function buildDashboardByFamily(){
    return (state.families||[]).map(function(f){
      var total = 0;
      var rows = [];
      f.members.forEach(function(m){
        var picks = state.signups[m.id] || {};
        Object.keys(picks).forEach(function(actId){
          var a = findActivity(state, actId);
          if (!a) return;
          var pp = parsePricePerPerson(a.price);
          if (pp != null) total += pp;
          var day = findDay(state, a.dayId);
          rows.push({ memberName: m.name, actName: a.name, dayTitle: day ? day.title : '', note: picks[actId] || '', price: pp });
        });
      });
      if (!rows.length) {
        return '<div class="dash-fam-card"><div class="dash-fam-head"><span>' + escapeHtml(f.name) + '</span></div><p class="hint">No saved picks yet.</p></div>';
      }
      var rowsHtml = rows.map(function(r){
        return '<li class="dash-fam-row"><span class="dash-fam-member">' + escapeHtml(r.memberName) + '</span><span>' + escapeHtml(r.actName) + ' <span class="dash-fam-day">(' + escapeHtml(r.dayTitle) + ')</span></span>' +
          (r.note ? ('<span class="chip chip-empty">' + escapeHtml(r.note) + '</span>') : '') +
          (r.price != null ? ('<span class="dash-fam-price">' + formatMoney(r.price) + '</span>') : '') +
          '</li>';
      }).join('');
      return '<div class="dash-fam-card"><div class="dash-fam-head"><span>' + escapeHtml(f.name) + '</span>' + (total > 0 ? ('<span class="dash-fam-total">Est. total ' + formatMoney(total) + '</span>') : '') + '</div>' +
        '<ul class="dash-fam-list">' + rowsHtml + '</ul></div>';
    }).join('');
  }

  function buildDashboardSection(){
    return '<section class="panel dashboard-panel" id="dashboard"><div class="panel-head"><span class="eyebrow">The full picture</span><h2>Trip Dashboard</h2>' +
      '<p class="lede">Saved picks only. Use this for the at-a-glance view — e.g. total headcount and package breakdown for Roatán, or which days still have no one signed up.</p></div>' +
      '<h3 class="dash-subhead first">By day / port</h3><div class="dash-day-grid">' + buildDashboardByDay() + '</div>' +
      '<h3 class="dash-subhead">By family</h3><div class="dash-fam-grid">' + buildDashboardByFamily() + '</div>' +
      '</section>';
  }

  function buildAddActivitySection(){
    if (readOnly) {
      return '<section class="panel add-panel" id="add-activity"><div class="panel-head"><span class="eyebrow">Missing something?</span><h2>Suggest an activity</h2></div>' +
        '<p class="lede">This view is read-only. Send new activity ideas to Thameem to add.</p></section>';
    }
    if (!addActivityForm.dayId) {
      var firstDay = sortedDays(state)[0];
      addActivityForm.dayId = firstDay && firstDay.id;
    }
    var dayOptions = sortedDays(state).map(function(d){
      var sel = d.id === addActivityForm.dayId ? ' selected' : '';
      var lbl = d.label ? (d.label + ' — ' + d.title) : d.title;
      return '<option value="' + d.id + '"' + sel + '>' + escapeHtml(lbl) + '</option>';
    }).join('');
    var typeOptions = Object.keys(TYPES).map(function(k){
      var sel = k === addActivityForm.type ? ' selected' : '';
      return '<option value="' + k + '"' + sel + '>' + escapeHtml(TYPES[k]) + '</option>';
    }).join('');

    return '<section class="panel add-panel" id="add-activity"><div class="panel-head"><span class="eyebrow">Missing something?</span><h2>Add an activity</h2>' +
      '<p class="lede">Anyone can add one, with a link, video, or price if you have it — it shows up for everyone right away.</p></div>' +
      '<div class="add-form">' +
      '<div class="field full"><label>Activity name</label><input type="text" id="add-activity-name" placeholder="e.g. Snorkeling trip, Family game night" /></div>' +
      '<div class="field"><label>Day</label><select id="add-activity-day">' + dayOptions + '</select></div>' +
      '<div class="field"><label>Type</label><select id="add-activity-type">' + typeOptions + '</select></div>' +
      '<div class="field"><label>Price <span class="optional">(optional)</span></label><input type="text" id="add-activity-price" placeholder="e.g. $40/pp, Free" /></div>' +
      '<div class="field"><label>Link <span class="optional">(optional)</span></label><input type="url" id="add-activity-link" placeholder="https://…" /></div>' +
      '<div class="field"><label>Video link <span class="optional">(optional)</span></label><input type="url" id="add-activity-youtube" placeholder="https://youtube.com/…" /></div>' +
      '<div class="field full"><label>Note <span class="optional">(optional)</span></label><input type="text" id="add-activity-note" placeholder="Time, location, anything useful" /></div>' +
      '<button type="button" class="btn btn-primary" data-action="add-activity">Add activity</button>' +
      '</div></section>';
  }

  function buildFooter(){
    return '<footer class="page-footer"><p>Built for the group sailing MSC Seascape, Galveston &rarr; Western Caribbean, Sep 6&ndash;13, 2026. Parking, WiFi setup, and packing details are in the <a href="https://claude.ai/code/artifact/89af28a1-651d-4c02-ac2f-561082514b1c" target="_blank" rel="noopener">companion trip dossier</a>.</p>' +
      '<p class="fine">Anyone with this link can add their family’s picks or a new activity — changes show up for everyone right away.</p></footer>';
  }

  function render(){
    var rootEl = document.getElementById('root');
    if (!rootEl) return;
    if (!state) {
      rootEl.innerHTML = '<div class="page"><p class="hint">Something went wrong loading this page. Refresh, or ask Thameem to check the link.</p></div>';
      return;
    }
    rootEl.innerHTML = '<div class="page">' + buildHeader() + buildMobileNav() + '<main>' + buildFamilySection() + buildOverviewSection() + buildExploreSection() + buildDashboardSection() + buildAddActivitySection() + '</main>' + buildFooter() + '</div>';
  }

  // ---------- event delegation ----------
  function onRootClick(e){
    var el = e.target.closest ? e.target.closest('[data-action]') : null;
    if (!el) return;
    var action = el.getAttribute('data-action');
    if (action === 'select-family') selectFamily(el.getAttribute('data-family-id'));
    else if (action === 'add-family') addFamily();
    else if (action === 'select-member') selectMember(el.getAttribute('data-family-id'), el.getAttribute('data-member-id'));
    else if (action === 'add-member') addMember(el.getAttribute('data-family-id'));
    else if (action === 'remove-member') removeMember(el.getAttribute('data-family-id'), el.getAttribute('data-member-id'));
    else if (action === 'save-family') saveFamily(el.getAttribute('data-family-id'));
    else if (action === 'discard-family') discardFamily(el.getAttribute('data-family-id'));
    else if (action === 'add-activity') submitAddActivity();
    else if (action === 'toggle-mobile-nav') toggleMobileNav();
    else if (action === 'close-mobile-nav') closeMobileNav();
    else if (action === 'submit-pin-setup') submitPinSetup(el.getAttribute('data-family-id'));
    else if (action === 'submit-pin-enter') submitPinEnter(el.getAttribute('data-family-id'));
  }

  function onRootChange(e){
    var el = e.target;
    if (!el) return;
    if (el.id === 'add-activity-day') { addActivityForm.dayId = el.value; }
    else if (el.id === 'add-activity-type') { addActivityForm.type = el.value; }
    else if (el.matches && el.matches('[data-action="toggle-activity"]')) {
      toggleActivity(el.getAttribute('data-family-id'), el.getAttribute('data-member-id'), el.getAttribute('data-activity-id'));
    }
  }

  function onRootFocusOut(e){
    var t = e.target;
    if (!t || !t.matches) return;
    if (t.matches('[data-field="family-name"]')) {
      var fid = t.getAttribute('data-family-id');
      var d = getDraftFamily(fid);
      var v = t.value.trim();
      d.name = v || d.name || 'Family';
      saveDraftsToLocal();
      render();
    } else if (t.matches('[data-field="member-name"]')) {
      var fid2 = t.getAttribute('data-family-id');
      var mid = t.getAttribute('data-member-id');
      var d2 = getDraftFamily(fid2);
      var mem = null;
      d2.members.forEach(function(m){ if (m.id === mid) mem = m; });
      var v2 = t.value.trim();
      if (mem) mem.name = v2 || mem.name || 'Member';
      saveDraftsToLocal();
      render();
    } else if (t.matches('[data-field="pick-note"]')) {
      setPickNote(t.getAttribute('data-family-id'), t.getAttribute('data-member-id'), t.getAttribute('data-activity-id'), t.value);
      render();
    }
  }

  function onRootKeydown(e){
    var t = e.target;
    if (t && t.matches && e.key === 'Enter' && (t.matches('[data-field="family-name"]') || t.matches('[data-field="member-name"]') || t.matches('[data-field="pick-note"]'))) {
      e.preventDefault();
      t.blur();
    }
    if (t && t.matches && e.key === 'Enter' && (t.matches('[data-field="pin-setup"]') || t.matches('[data-field="pin-setup-confirm"]'))) {
      e.preventDefault();
      submitPinSetup(t.getAttribute('data-family-id'));
    }
    if (t && t.matches && e.key === 'Enter' && t.matches('[data-field="pin-enter"]')) {
      e.preventDefault();
      submitPinEnter(t.getAttribute('data-family-id'));
    }
    if (e.key === 'Escape' && mobileNavOpen) closeMobileNav();
  }

  function bindEvents(){
    var rootEl = document.getElementById('root');
    if (!rootEl) return;
    rootEl.addEventListener('click', onRootClick);
    rootEl.addEventListener('change', onRootChange);
    rootEl.addEventListener('focusout', onRootFocusOut);
    rootEl.addEventListener('keydown', onRootKeydown);
  }

  function pollRemote(){
    fetch(FIREBASE_URL + '/state.json', { cache: 'no-store' }).then(function(res){
      return res.ok ? res.json() : null;
    }).then(function(remote){
      if (!remote) return;
      if (JSON.stringify(remote) === JSON.stringify(state)) return;
      var activeTag = document.activeElement && document.activeElement.tagName;
      if (activeTag === 'INPUT' || activeTag === 'TEXTAREA') return; // don't yank focus mid-typing
      state = remote;
      render();
    }).catch(function(){});
  }

  function boot(){
    if (!state) { render(); return; }
    bindEvents();
    if (myFamilyId) applyFamilyGate(myFamilyId);
    setStatus('connecting', 'Connecting…');
    render();
    fetch(FIREBASE_URL + '/state.json', { cache: 'no-store' }).then(function(res){
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }).then(function(remote){
      if (remote) {
        state = remote;
        setStatus('idle', 'Live.');
        render();
      } else {
        // First load ever: seed the database with the bundled starting data.
        return fetch(FIREBASE_URL + '/state.json', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(state)
        }).then(function(){
          setStatus('idle', 'Live.');
          render();
        });
      }
    }).catch(function(){
      readOnly = true; readOnlyReason = 'unavailable';
      setStatus('local-only', 'Not connected — saved on this device only.');
      render();
    });
    setInterval(pollRemote, 6000);
  }

  boot();
})();
</script>
</body>
</html>
